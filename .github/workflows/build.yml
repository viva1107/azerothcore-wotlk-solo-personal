name: Build AzerothCore (Windows)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:   # 手动触发

env:
  BUILD_TYPE: RelWithDebInfo

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 安装依赖（bison + MySQL + Boost）
        run: |
          choco install -y bison
          choco install -y mysql
          choco install -y boost-msvc-14.3
          echo "C:\Program Files\MySQL\MySQL Server 8.0\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: 定位 Boost
        shell: pwsh
        run: |
          $dirs = @()
          if (Test-Path C:\local) {
            $dirs += Get-ChildItem C:\local -Directory -Filter "boost*"
          }
          $boost = $dirs | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $boost) { throw "未找到 Boost，安装可能失败" }
          echo "BOOST_ROOT=$($boost.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Boost: $($boost.FullName)"

      - name: 配置 CMake
        run: >
          cmake -B build -S .
          -G "Visual Studio 17 2022" -A x64
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DBOOST_ROOT=${{ env.BOOST_ROOT }}
          -DMYSQL_INCLUDE_DIR="C:\Program Files\MySQL\MySQL Server 8.0\include"
          -DMYSQL_LIBRARY="C:\Program Files\MySQL\MySQL Server 8.0\lib\libmysql.lib"
          -DTOOLS_BUILD=all
          -DSCRIPTS=static

      - name: 编译
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

      - name: 打包产物
        run: |
          7z a ac-build-windows.7z ".\build\bin\${{ env.BUILD_TYPE }}\*"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: azerothcore-build-windows
          path: ac-build-windows.7z
          retention-days: 7
